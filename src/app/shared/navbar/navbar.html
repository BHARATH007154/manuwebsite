<header class="topbar">
  <div class="nav-wrap">
    <a class="brand" routerLink="/" (click)="closeMobileMenu()" aria-label="Naveen Engineering Technology home">
      <span class="brand-mark" aria-hidden="true">
        <span class="mark-core">N</span>
        <span class="mark-orbit mark-orbit-one"></span>
        <span class="mark-orbit mark-orbit-two"></span>
      </span>
      <span class="brand-text">
        <strong>Naveen Engineering</strong>
        <small>Technology</small>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" [class.is-open]="mobileMenuOpen()" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a>
      <a routerLink="/company-profile" routerLinkActive="active" (click)="closeMobileMenu()">Company Profile</a>

      <div class="nav-actions" aria-label="Quick contact actions">
        <a
          class="nav-contact"
          href="tel:+917305298828"
          (click)="closeMobileMenu()"
        >
          <span class="cta-icon" aria-hidden="true">☎</span>
          Contact Us
        </a>
        <a
          class="nav-cta"
          routerLink="/request-quote"
          (click)="closeMobileMenu()"
        >
          <span class="cta-icon" aria-hidden="true">✉</span>
          Request a Quote
        </a>
      </div>
    </nav>
  </div>
</header>
